name: Apply Robocopy Hook Test

on:
  pull_request:
    branches: [ canary ]
    types: [ synchronize, reopened ]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Listenarrs/Listenarr' && github.head_ref == 'bugfix/unix-folder-name-space'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/unix-folder-name-space
      - name: Apply exact reviewed test update
        run: python .github/scripts/use-directory-move-test-hook.py
      - name: Commit exact test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Features/Api/Services/FileMoverFallbackTests.cs
          git commit -m "test(filesystem): force verified robocopy fallback deterministically"
          git push origin HEAD:bugfix/unix-folder-name-space
