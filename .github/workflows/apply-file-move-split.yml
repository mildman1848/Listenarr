name: Apply File Move Split

on:
  pull_request:
    branches: [ canary ]
    types: [ synchronize, reopened ]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Listenarrs/Listenarr' && github.head_ref == 'bugfix/unix-folder-name-space'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/unix-folder-name-space
      - name: Apply exact reviewed split
        run: python .github/scripts/split-file-move-methods.py
      - name: Commit exact split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            listenarr.infrastructure/FileSystem/FileMover.cs \
            listenarr.infrastructure/FileSystem/FileMover.Move.cs
          git commit -m "refactor(filesystem): split file move workflow"
          git push origin HEAD:bugfix/unix-folder-name-space
