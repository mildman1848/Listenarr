name: Apply File Alias Classifier

on:
  pull_request:
    branches: [ canary ]
    types: [ synchronize, reopened ]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Listenarrs/Listenarr' && github.head_ref == 'bugfix/unix-folder-name-space'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/unix-folder-name-space
      - name: Apply exact reviewed classifier wiring
        run: python .github/scripts/wire-file-alias-classifier.py
      - name: Commit exact classifier wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            listenarr.infrastructure/FileSystem/FileMover.Copying.cs \
            listenarr.infrastructure/FileSystem/FileMover.FileMoveLocks.cs
          git commit -m "fix(filesystem): apply regular-file alias checks"
          git push origin HEAD:bugfix/unix-folder-name-space
