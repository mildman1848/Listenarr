name: Diagnose Latest FileMover Tests

on:
  pull_request:
    branches: [ canary ]
    types: [ synchronize, reopened ]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore listenarr.slnx
      - id: tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          dotnet test tests/Listenarr.Tests.csproj -c Release --no-restore `
            --filter "FullyQualifiedName~MoveDirectoryAsync_RobocopyFallback_UsesArgumentList|FullyQualifiedName~MoveDirectoryAsync_ConflictingDestination_DoesNotInvokeRobocopy|FullyQualifiedName~MoveDirectoryAsync_UnownedEmptyDestination_IsRejectedWithoutMutation|FullyQualifiedName~ActiveProductionSourceFiles_RemainFocused" `
            --logger "trx;LogFileName=filemover.trx" `
            --results-directory TestResults
          $status = $LASTEXITCODE
          "status=$status" >> $env:GITHUB_OUTPUT
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-filemover-trx
          path: TestResults
      - if: steps.tests.outputs.status != '0'
        shell: pwsh
        run: exit 1
