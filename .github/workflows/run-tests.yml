name: Diagnose Linux Backend Tests

on:
  pull_request:
    branches: [ canary ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: diagnose-linux-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux-backend-diagnostics:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore listenarr.slnx

      - name: Build backend
        run: dotnet build listenarr.slnx --no-restore --configuration Release

      - name: Run Linux backend tests with TRX
        id: backend_tests
        continue-on-error: true
        env:
          ASPNETCORE_ENVIRONMENT: Test
          Playwright__Enabled: 'false'
        run: |
          dotnet test listenarr.slnx -c Release --no-build \
            --results-directory TestResults \
            --logger "trx;LogFileName=linux-full.trx" \
            --logger "console;verbosity=normal"

      - name: Upload Linux test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: error

      - name: Preserve test failure status
        if: steps.backend_tests.outcome == 'failure'
        run: exit 1
