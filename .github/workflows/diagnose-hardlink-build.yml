name: Diagnose Hardlink Build

on:
  pull_request:
    branches: [ canary ]
    types: [ synchronize, reopened ]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore listenarr.slnx
      - id: build
        shell: bash
        run: |
          set +e
          dotnet build listenarr.slnx --no-restore --configuration Release \
            --consoleLoggerParameters:ErrorsOnly > linux-errors.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardlink-build-linux-errors
          path: linux-errors.txt
      - if: steps.build.outputs.status != '0'
        run: exit 1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore listenarr.slnx
      - id: build
        shell: pwsh
        run: |
          dotnet build listenarr.slnx --no-restore --configuration Release `
            --consoleLoggerParameters:ErrorsOnly *> windows-errors.txt
          $status = $LASTEXITCODE
          "status=$status" >> $env:GITHUB_OUTPUT
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardlink-build-windows-errors
          path: windows-errors.txt
      - if: steps.build.outputs.status != '0'
        shell: pwsh
        run: exit 1
