name: Apply Directory Copy Hook

on:
  pull_request:
    branches:
      - canary
    paths:
      - .github/workflows/apply-directory-copy-hook.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/unix-folder-name-space
          fetch-depth: 0
      # This workflow applies one exact, reviewed test-hook invocation and is removed afterward.
      - name: Apply exact staging hook patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('listenarr.infrastructure/FileSystem/FileMover.DirectoryCopy.cs')
          text = path.read_text(encoding='utf-8')
          marker = 'AfterDirectoryCopyStagingDirectoriesCreatedForTestAsync'
          if marker in text:
              raise SystemExit(0)
          old = '''            Directory.CreateDirectory(stagingDirectory);
        }

        foreach (var relativeFile in snapshot.RelativeFiles)
'''
          new = '''            Directory.CreateDirectory(stagingDirectory);
        }

        if (AfterDirectoryCopyStagingDirectoriesCreatedForTestAsync != null)
        {
            await AfterDirectoryCopyStagingDirectoriesCreatedForTestAsync(stagingRoot);
        }

        foreach (var relativeFile in snapshot.RelativeFiles)
'''
          if old not in text:
              raise RuntimeError('staging hook anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit staging hook
        shell: bash
        run: |
          if git diff --quiet -- listenarr.infrastructure/FileSystem/FileMover.DirectoryCopy.cs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listenarr.infrastructure/FileSystem/FileMover.DirectoryCopy.cs
          git commit -m "testability(filesystem): invoke nested staging barrier"
          git push origin HEAD:bugfix/unix-folder-name-space
