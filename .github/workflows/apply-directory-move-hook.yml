name: Apply Directory Move Test Hook

on:
  pull_request:
    branches: [ canary ]
    types: [ synchronize, reopened ]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Listenarrs/Listenarr' && github.head_ref == 'bugfix/unix-folder-name-space'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/unix-folder-name-space
      - name: Apply exact reviewed hook
        run: python .github/scripts/add-directory-move-test-hook.py
      - name: Commit exact hook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            listenarr.infrastructure/FileSystem/FileMover.cs \
            listenarr.infrastructure/FileSystem/FileMover.TestHooks.cs
          git commit -m "test(filesystem): add deterministic direct-move barrier"
          git push origin HEAD:bugfix/unix-folder-name-space
