name: Apply Empty Destination Production Fix

on:
  pull_request:
    branches: [ canary ]
    types: [ synchronize, reopened ]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Listenarrs/Listenarr' && github.head_ref == 'bugfix/unix-folder-name-space'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/unix-folder-name-space
      - name: Apply exact reviewed production fix
        run: python .github/scripts/remove-empty-destination-placeholder.py
      - name: Commit exact production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            listenarr.infrastructure/FileSystem/FileMover.cs \
            listenarr.infrastructure/FileSystem/FileMover.TestHooks.cs \
            listenarr.infrastructure/FileSystem/FileMover.EmptyDestinationPlaceholder.cs
          git commit -m "fix(filesystem): reject unowned empty move destinations"
          git push origin HEAD:bugfix/unix-folder-name-space
