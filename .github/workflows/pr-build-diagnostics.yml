name: Temporary PR Build Diagnostics

on:
  pull_request:
    branches:
      - canary

permissions:
  contents: read

jobs:
  build-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore listenarr.slnx
      - run: dotnet build listenarr.slnx --no-restore --configuration Release --consoleLoggerParameters:ErrorsOnly
