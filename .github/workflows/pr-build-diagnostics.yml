name: Temporary PR Build Diagnostics

on:
  pull_request:
    branches:
      - canary

permissions:
  contents: read

jobs:
  build-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print compiler errors
        shell: bash
        run: |
          dotnet restore listenarr.slnx --verbosity quiet > /tmp/restore.log 2>&1
          if ! dotnet build listenarr.slnx --no-restore --configuration Release --consoleLoggerParameters:ErrorsOnly > /tmp/build.log 2>&1; then
            grep -E "error (CS|NETSDK)|: error " /tmp/build.log | head -n 40
            exit 1
          fi
