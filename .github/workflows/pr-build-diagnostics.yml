name: Temporary PR Build Diagnostics

on:
  pull_request:
    branches:
      - canary

permissions:
  contents: read

jobs:
  build-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture compiler errors
        id: build
        shell: bash
        run: |
          dotnet restore listenarr.slnx --verbosity quiet > /tmp/restore.log 2>&1
          set +e
          dotnet build listenarr.slnx --no-restore --configuration Release --consoleLoggerParameters:ErrorsOnly > /tmp/build.log 2>&1
          status=$?
          set -e
          tail -n 200 /tmp/build.log > /tmp/build-tail.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-errors
          path: /tmp/build-tail.txt
          if-no-files-found: error
      - name: Fail when build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
