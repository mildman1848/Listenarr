name: Apply Pinned Parent Hardening

on:
  pull_request:
    branches:
      - canary
    paths:
      - .github/workflows/apply-pinned-parent-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/unix-folder-name-space
          fetch-depth: 0
      - name: Make pinned directory implementation partial
        shell: python
        run: |
          from pathlib import Path

          path = Path('listenarr.infrastructure/FileSystem/PinnedDirectoryCreation.cs')
          text = path.read_text(encoding='utf-8')
          old = 'internal sealed class PinnedDirectoryCreation : IDisposable\n'
          new = 'internal sealed partial class PinnedDirectoryCreation : IDisposable\n'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise RuntimeError('PinnedDirectoryCreation declaration anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit partial declaration
        shell: bash
        run: |
          if git diff --quiet -- listenarr.infrastructure/FileSystem/PinnedDirectoryCreation.cs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listenarr.infrastructure/FileSystem/PinnedDirectoryCreation.cs
          git commit -m "refactor(filesystem): split pinned hierarchy implementation"
          git push origin HEAD:bugfix/unix-folder-name-space
