name: Apply Pinned Parent Hardening

on:
  push:
    branches:
      - bugfix/unix-folder-name-space
    paths:
      - .github/workflows/apply-pinned-parent-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/unix-folder-name-space
          fetch-depth: 0
      - name: Apply reviewed native patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('listenarr.infrastructure/FileSystem/PinnedDirectoryCreation.cs')
          text = path.read_text(encoding='utf-8')
          if 'EnsureWindowsParentIsNotReparsePoint' in text:
              raise SystemExit(0)

          text = text.replace(
              '    private const uint FileAttributeHidden = 0x00000002;\n',
              '    private const uint FileAttributeHidden = 0x00000002;\n'
              '    private const uint FileAttributeReparsePoint = 0x00000400;\n',
              1,
          )
          text = text.replace(
              '        ValidateLeafName(childName);\n\n        return OperatingSystem.IsWindows()\n',
              '        ValidateLeafName(childName);\n'
              '        ExclusiveDirectoryCreator.InvokeBeforeOpenParentHook(parentPath);\n\n'
              '        return OperatingSystem.IsWindows()\n',
              1,
          )
          text = text.replace(
              '        var parentHandle = OpenDirectoryWindows(parentPath, openReparsePoint: false);\n        try\n        {\n',
              '        var parentHandle = OpenDirectoryWindows(parentPath, openReparsePoint: true);\n'
              '        try\n'
              '        {\n'
              '            EnsureWindowsParentIsNotReparsePoint(parentHandle, parentPath);\n',
              1,
          )
          text = text.replace(
              '        var parentHandle = OpenDirectoryUnix(parentPath, noFollow: false);\n',
              '        var parentHandle = OpenDirectoryUnix(parentPath, noFollow: true);\n',
              1,
          )
          anchor = '''    private static SafeFileHandle OpenDirectoryWindows(
              string path,
              bool openReparsePoint)
          {
          '''
          method = '''    private static void EnsureWindowsParentIsNotReparsePoint(
              SafeFileHandle handle,
              string path)
          {
              if (!GetFileAttributeTagInformationByHandleEx(
                      handle,
                      FileInformationClass.FileAttributeTagInfo,
                      out var information,
                      (uint)Marshal.SizeOf<FileAttributeTagInformation>()))
              {
                  throw new Win32Exception(
                      Marshal.GetLastWin32Error(),
                      $"Could not inspect directory '{path}'.");
              }

              if ((information.FileAttributes & FileAttributeReparsePoint) != 0)
              {
                  throw new InvalidOperationException(
                      "A pinned directory parent cannot be a symbolic link or reparse point.");
              }
          }

          '''
          if anchor not in text:
              raise RuntimeError('OpenDirectoryWindows anchor not found')
          text = text.replace(anchor, method + anchor, 1)
          text = text.replace(
              '''    private enum FileInformationClass
              {
                  FileIdInfo = 18
              }
          ''',
              '''    private enum FileInformationClass
              {
                  FileAttributeTagInfo = 9,
                  FileIdInfo = 18
              }
          ''',
              1,
          )
          text = text.replace(
              '''    [StructLayout(LayoutKind.Sequential)]
              private struct FileId128
          ''',
              '''    [StructLayout(LayoutKind.Sequential)]
              private struct FileAttributeTagInformation
              {
                  public uint FileAttributes;
                  public uint ReparseTag;
              }

              [StructLayout(LayoutKind.Sequential)]
              private struct FileId128
          ''',
              1,
          )
          text = text.replace(
              '''    [DllImport("kernel32.dll", SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool GetFileInformationByHandleEx(
          ''',
              '''    [DllImport("kernel32.dll", EntryPoint = "GetFileInformationByHandleEx", SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool GetFileAttributeTagInformationByHandleEx(
                  SafeFileHandle fileHandle,
                  FileInformationClass fileInformationClass,
                  out FileAttributeTagInformation fileInformation,
                  uint bufferSize);

              [DllImport("kernel32.dll", SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool GetFileInformationByHandleEx(
          ''',
              1,
          )
          path.write_text(text, encoding='utf-8')
      - name: Commit native hardening
        shell: bash
        run: |
          if git diff --quiet -- listenarr.infrastructure/FileSystem/PinnedDirectoryCreation.cs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listenarr.infrastructure/FileSystem/PinnedDirectoryCreation.cs
          git commit -m "fix(filesystem): reject linked parents before relative creation"
          git push origin HEAD:bugfix/unix-folder-name-space
