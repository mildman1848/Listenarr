name: Apply Pinned Directory Copy Parent Fix

on:
  pull_request:
    branches: [ canary ]
    types: [ synchronize, reopened ]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Listenarrs/Listenarr' && github.head_ref == 'bugfix/unix-folder-name-space'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/unix-folder-name-space
      - name: Apply exact reviewed pinned-parent fix
        run: python .github/scripts/pin-directory-copy-parent.py
      - name: Commit exact pinned-parent fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            listenarr.infrastructure/FileSystem/PinnedDirectoryCreation.Hierarchy.cs \
            listenarr.infrastructure/FileSystem/FileMover.DirectoryCopy.cs
          git commit -m "fix(filesystem): pin directory-copy destination parent"
          git push origin HEAD:bugfix/unix-folder-name-space
